

<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <!-- Breadcrumbs -->
            <div class="flex flex-wrap items-center font-medium">


            </div>
            <!-- Title -->
            <div class="mt-2">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                    <strong style="margin-left: 500px;">modifier classe</strong>

                </h2>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10" style="margin-left: 250px;">

        <div class="max-w-3xl">

            <div class="prose prose-sm max-w-3xl">


            </div>

            <form (ngSubmit)= "onSubmit()" [formGroup]="ClassForm" class="flex flex-col mt-8 p-8 pb-4 bg-card rounded-2xl shadow overflow-hidden">
                <div class="flex flex-col gt-xs:flex-row">
                    <mat-form-field


                        class="flex-auto gt-xs:pr-3">
                        <mat-label>name</mat-label>
                        <input formControlName="name"  matInput >
                        <mat-icon
                            class="icon-size-5"
                            matSuffix
                            [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                    </mat-form-field>


                        <!-- List of Students -->


                </div>
                <button [disabled]="!ClassForm.valid" class = "btn btn-success" type ="submit">Submit</button>

            </form>




        </div>

    </div>

</div>
