

<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->


    <!-- Main -->
    <div class="flex-auto p-6 sm:p-10">

        <div class="max-w-3xl">

            <div class="prose prose-sm max-w-3xl">


            </div>

            <form (ngSubmit)= "onSubmit()" [formGroup]="DemandeForm" class="flex flex-col mt-8 p-8 pb-4 bg-card rounded-2xl shadow overflow-hidden">
                <div class="flex flex-col gt-xs:flex-row">
                    <mat-form-field


                            class="flex-auto gt-xs:pr-3">
                        <mat-label>username</mat-label>
                        <input formControlName="username"  matInput >
                        <mat-icon
                                class="icon-size-5"
                                matSuffix
                                [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                    </mat-form-field>
                    <mat-form-field

                            class="flex-auto gt-xs:pl-3">
                        <mat-label>password</mat-label>
                        <input formControlName="password"   matInput>
                        <mat-icon
                                class="icon-size-5"
                                matSuffix
                                [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                    </mat-form-field>
                </div>


                <button [disabled]="!DemandeForm.valid" class = "btn btn-success" type ="submit">Submit</button>

            </form>




        </div>

    </div>

</div>
