<div class="notifications-container">
    <!-- Notification Bell Icon with Badge -->
    <button mat-icon-button [matMenuTriggerFor]="notificationMenu" 
            class="notification-trigger">
        <mat-icon [matBadge]="(unreadCount$ | async) || 0" 
                  [matBadgeHidden]="(unreadCount$ | async) === 0"
                  matBadgeColor="warn"
                  matBadgeSize="small">
            notifications
        </mat-icon>
    </button>

    <!-- Notification Menu -->
    <mat-menu #notificationMenu="matMenu" class="notification-menu" xPosition="before">
        <div class="notification-header">
            <h3>Notifications</h3>
            <button mat-button 
                    (click)="markAllAsRead()" 
                    *ngIf="(unreadCount$ | async)! > 0"
                    class="mark-all-read-btn">
                Mark all as read
            </button>
        </div>
        
        <mat-divider></mat-divider>
        
        <div class="notification-list">
            <ng-container *ngIf="(notifications$ | async)?.length; else noNotifications">
                <div *ngFor="let notification of (notifications$ | async)" 
                     class="notification-item"
                     [class.unread]="!notification.isRead"
                     (click)="markAsRead(notification)">
                    
                    <div class="notification-content">
                        <div class="notification-header-item">
                            <mat-icon [class]="getNotificationColor(notification.type)">
                                {{getNotificationIcon(notification.type)}}
                            </mat-icon>
                            <span class="notification-title">{{notification.title}}</span>
                            <span class="notification-time">{{formatDate(notification.createdAt!)}}</span>
                        </div>
                        
                        <div class="notification-message">
                            {{notification.message}}
                        </div>
                    </div>
                    
                    <div class="notification-actions">
                        <button mat-icon-button 
                                (click)="deleteNotification(notification); $event.stopPropagation()"
                                matTooltip="Delete notification">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </div>
            </ng-container>
            
            <ng-template #noNotifications>
                <div class="no-notifications">
                    <mat-icon>notifications_none</mat-icon>
                    <p>No notifications</p>
                </div>
            </ng-template>
        </div>
    </mat-menu>
</div>
