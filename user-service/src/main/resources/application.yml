          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Keycloak configuration for internal cluster communication
keycloak:
  auth-server-url: http://keycloak.default.svc.cluster.local:8086

eureka:
  client:
    service-url:
      defaultZone: http://eureka-0.eureka.default.svc.cluster.local:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false  # Temporarily disable mail health check
