apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  serviceName: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: amriyass12/api-gateway:latest
          imagePullPolicy: Always
      imagePullSecrets:
        - name: regcred
          ports:
            - containerPort: 8080
          resources:   # ✅ prevent resource hogging
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 312Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi # adjust size as needed

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-gateway-svc
spec:
  ports:
  - protocol: TCP
    targetPort: 8080
    port: 9191
    nodePort: 30500  # This port is for NodePort exposure (optional)
  selector:
    app: api-gateway
  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080  # Exposes HTTP traffic to the application
  selector:
    app: api-gateway

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:4200, https://localhost:4200, https://stb-stages.com, http://stb-stages.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,X-LANG,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,X-Api-Key,X-Device-Id,Access-Control-Allow-Origin,Authorization,Accept,Origin"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "gateway-service"
spec:
  tls:  # TLS configuration block
  - hosts:
      - "stb-stages.com"  # Your actual domain
    secretName: stb-stages-tls  # The TLS secret containing the SSL certificate and key
  rules:
    - host: "stb-stages.com"  # Your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
