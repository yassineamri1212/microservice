# templates/grafana-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.admin.user }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.admin.password }}
        - name: GF_DATASOURCES_PATH
          value: /etc/grafana/provisioning/datasources
        {{- if .Values.env }}
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        {{- if .Values.storage.enabled }}
        - name: grafana-storage
          mountPath: /var/lib/grafana
        {{- end }}
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      {{- if .Values.storage.enabled }}
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      {{- end }}
---
# templates/grafana-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 3000
      nodePort: {{ .Values.service.nodePort }}
  type: {{ .Values.service.type }}
---
# templates/grafana-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    {{- (index .Values.datasources "datasources.yaml") | toYaml | nindent 4 }}
---
{{- if .Values.storage.enabled }}
# templates/grafana-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass }}
  {{- end }}
{{- end }}
