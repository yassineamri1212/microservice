# Ultra-minimal Loki configuration for stability
image:
  repository: grafana/loki
  tag: "2.9.1"
  pullPolicy: IfNotPresent

# Increased resources to handle the load
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Storage configuration
storage:
  size: 20Gi

service:
  port: 3100
  type: ClusterIP

# Ultra-minimal Loki configuration - single instance mode
config:
  auth_enabled: false
  
  server:
    http_listen_port: 3100
    log_level: info
  
  # Single instance mode - no distributed components
  target: all
  
  ingester:
    wal:
      enabled: false
    lifecycler:
      address: 127.0.0.1
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
        final_sleep: 0s
    chunk_idle_period: 1h
    max_chunk_age: 1h
    chunk_target_size: 1048576
    chunk_retain_period: 30s
    
  limits_config:
    enforce_metric_name: false
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    max_streams_per_user: 10000
    max_line_size: 256000
    max_entries_limit_per_query: 5000
    max_global_streams_per_user: 10000
    
  schema_config:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
          
  storage_config:
    boltdb_shipper:
      active_index_directory: /loki/boltdb-shipper-active
      cache_location: /loki/boltdb-shipper-cache
      cache_ttl: 24h
      shared_store: filesystem
    filesystem:
      directory: /loki/chunks
      
  chunk_store_config:
    max_look_back_period: 0s
    
  table_manager:
    retention_deletes_enabled: true
    retention_period: 72h  # 3 days only

# Promtail configuration
promtail:
  image:
    repository: grafana/promtail
    tag: "2.9.1"
    pullPolicy: IfNotPresent
    
  config:
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push
        batch_wait: 5s
        batch_size: 1048576
        
    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: __host__
      - action: drop
        source_labels:
        - __meta_kubernetes_pod_label_app_kubernetes_io_name
        regex: promtail
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
      - source_labels:
        - __meta_kubernetes_pod_label_app
        target_label: app